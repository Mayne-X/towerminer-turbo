[package]
name = "towerminer"
version = "0.2.2"
edition = "2021"
license = "Apache-2.0"
description = "TowerWalk CPU miner for Jetsam (fork of jetsam-extminer)"

[dependencies]
jetsam_core       = { path = "../vendor/jetsam_core" }
jetsam_poseidon2b = { path = "../vendor/jetsam_poseidon2b" }
reqwest    = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
clap       = { version = "4", features = ["derive", "env"] }
hex        = "0.4"
anyhow     = "1"
libc       = "0.2"

# Negative mutants for the gate self-check: each breaks one kernel invariant
# (xorshift 29 -> 28; lane order 1,0,2,3), so --gate and the start-up
# self-test MUST fail. Never in a release build (--version shows "+mutant",
# scripts/build.sh refuses it).
[features]
mutant-xorshift28 = []
mutant-lane-order = []
